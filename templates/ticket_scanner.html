```

</div>

<script>

    const form = document.getElementById("scanner-form");
    const input = document.getElementById("qr_code");
    const result = document.getElementById("result");

    /*
     * Prevent multiple requests while one QR scan
     * is being processed.
     */
    let scannerLocked = false;


    // ========================================================
    // VALIDATE TICKET
    // ========================================================

    async function validateQRCode(qrCode) {

        if (scannerLocked) {
            return;
        }

        scannerLocked = true;

        qrCode = qrCode.trim();

        if (!qrCode) {
            scannerLocked = false;
            return;
        }


        const csrfToken = document.querySelector(
            "[name=csrfmiddlewaretoken]"
        ).value;


        try {

            const response = await fetch(
                "{% url 'validate_ticket' %}",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded",

                        "X-CSRFToken": csrfToken
                    },

                    body: new URLSearchParams({
                        qr_code: qrCode
                    })
                }
            );


            const data = await response.json();


            result.style.display = "block";


            // =================================================
            // SUCCESS
            // =================================================

            if (data.success) {

                result.className = "success";

                result.innerHTML = `
                    <strong>✓ Ticket Valid</strong>
                    <br><br>

                    Event: ${data.event}
                    <br>

                    Ticket Type: ${data.ticket_type}
                    <br>

                    Checked in successfully.
                `;

                input.value = "";

            }


            // =================================================
            // REJECTED
            // =================================================

            else {

                result.className = "error";

                result.innerHTML = `
                    <strong>✗ Ticket Rejected</strong>
                    <br><br>

                    ${data.message}
                `;

            }

        }

        catch (error) {

            console.error("Validation error:", error);

            result.style.display = "block";

            result.className = "error";

            result.innerHTML = `
                <strong>✗ Error</strong>
                <br><br>

                Unable to validate the ticket.
            `;

        }


        /*
         * Unlock scanner after a short delay.
         * This prevents the same QR from being
         * submitted many times immediately.
         */

        setTimeout(function () {

            scannerLocked = false;

        }, 1500);

    }


    // ========================================================
    // CAMERA SCAN SUCCESS
    // ========================================================

    function onScanSuccess(decodedText, decodedResult) {

        console.log(
            "QR code detected:",
            decodedText
        );


        /*
         * Put the scanned UUID into the input box
         * so the staff member can see what was scanned.
         */

        input.value = decodedText;


        /*
         * Send the scanned QR data to Django.
         */

        validateQRCode(decodedText);

    }


    // ========================================================
    // CAMERA SCAN FAILURE
    // ========================================================

    function onScanFailure(error) {

        /*
         * This function is intentionally empty.
         *
         * While searching for a QR code,
         * the scanner continuously reports failures.
         * That is normal.
         */

    }


    // ========================================================
    // START CAMERA SCANNER
    // ========================================================

    const scanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            },

            rememberLastUsedCamera: true
        },

        false
    );


    scanner.render(
        onScanSuccess,
        onScanFailure
    );


    // ========================================================
    // MANUAL TICKET ID VALIDATION
    // ========================================================

    form.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const qrCode = input.value.trim();


            if (!qrCode) {
                return;
            }


            validateQRCode(qrCode);

        }
    );

</script>
